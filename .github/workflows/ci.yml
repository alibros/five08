name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom's undici needs a Node with worker_threads.markAsUncloneable,
          # which Node 20 does not have. Match the version the project is
          # developed and released on.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for the end-to-end run
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
